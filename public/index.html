<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoT Solution Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#172033;background:#f7f9fc}.layout{max-width:1000px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:260px 1fr;gap:24px}aside,main{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#64748b}label{display:block;font-weight:600;margin:18px 0 8px}input,button{font:inherit}input[type=file],input[type=text]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px}input[type=range]{width:100%}button{border:0;border-radius:7px;background:#2563eb;color:#fff;padding:11px 16px;cursor:pointer}form{display:flex;gap:8px}form input{flex:1}.card{border:1px solid #e2e8f0;border-left:4px solid #16a34a;border-radius:8px;padding:16px;margin-top:12px}.score{color:#64748b;font-size:13px}.error{color:#b91c1c}.muted{font-size:13px;color:#64748b}@media(max-width:700px){.layout{grid-template-columns:1fr;margin:16px auto}form{flex-direction:column}}
</style>
</head>
<body><div class="layout">
<aside><h2>Settings</h2><label for="file">Upload Excel knowledge base</label><input id="file" type="file" accept=".xlsx,.xls"><p id="upload-status" class="muted">Choose a workbook to begin.</p><label for="top-n">Max results: <span id="top-val">5</span></label><input id="top-n" type="range" min="1" max="10" value="5"><label for="min-score">Minimum similarity: <span id="score-val">0.20</span></label><input id="min-score" type="range" min="0.10" max="0.80" step="0.05" value="0.20"></aside>
<main><h1>🔧 IoT Solution Finder</h1><p>Search your problem and symptom knowledge base to find a relevant fix.</p><form id="search-form"><input id="query" type="text" placeholder="Describe the problem or symptom…" required><button>Search</button></form><p id="status" class="muted"></p><section id="results" aria-live="polite"></section></main></div>
<script>
let fileReady=false;
const $=id=>document.getElementById(id);
$('top-n').oninput=()=> $('top-val').textContent=$('top-n').value;
$('min-score').oninput=()=> $('score-val').textContent=Number($('min-score').value).toFixed(2);
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;const fd=new FormData();fd.append('file',file);$('upload-status').textContent='Processing workbook…';try{const res=await fetch('/api/upload',{method:'POST',body:fd});const data=await res.json();if(!res.ok)throw Error(data.error||'Upload failed');fileReady=true;$('upload-status').textContent=`Loaded ${data.rows} rows. Columns: ${data.prob_col}, ${data.sym_col}, ${data.sol_col}.`;}catch(e){$('upload-status').textContent=e.message;}};
$('search-form').onsubmit=async e=>{e.preventDefault();if(!fileReady){$('status').textContent='Upload an Excel workbook first.';return;}const fd=new FormData();fd.append('query',$('query').value);fd.append('top_n',$('top-n').value);fd.append('min_score',$('min-score').value);$('status').textContent='Searching…';$('results').replaceChildren();try{const res=await fetch('/api/search',{method:'POST',body:fd});const data=await res.json();if(!res.ok)throw Error(data.error||'Search failed');$('status').textContent=data.corrected?`Auto-corrected “${data.query}” to “${data.corrected}”.`:'';if(!data.results.length){$('status').textContent+=' No matches found; try a different query or lower the threshold.';return;}for(const r of data.results){const card=document.createElement('article');card.className='card';const score=document.createElement('div');score.className='score';score.textContent=`Result ${r.rank} · Row ${r.row} · ${Math.round(r.score*100)}% match`;card.append(score);for(const [label,value] of [['Problem',r.problem],['Symptoms',r.symptoms],['Solution',r.solution]]){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+': ';p.append(strong,document.createTextNode(value));card.append(p);}$('results').append(card);}}catch(err){$('status').textContent=err.message;}};
</script></body></html>
